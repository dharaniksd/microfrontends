server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Remotes are imported by the shell from separate origins during local and containerized deployment.
  add_header Access-Control-Allow-Origin "*" always;

  # Angular routes are client-side routes; return the app shell for unknown paths.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|mjs|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*" always;
  }
}
